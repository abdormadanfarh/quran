<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسمّع القرآني التفاعلي</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23059669%22/><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2260%22>📖</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .quran-font { font-family: 'Amiri', serif; }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #059669;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-36">

    <!-- شريط التنقل العلوي -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm mb-4">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📖</span>
                <div>
                    <h1 class="text-base font-bold text-emerald-800 leading-tight">المسمّع القرآني</h1>
                    <span id="headerSub" class="text-xs text-slate-500 font-medium">الوضع: كشف تلقائي</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="bg-slate-100 p-1 rounded-xl flex items-center gap-1 border border-slate-200 text-xs">
                    <button id="tabAuto" class="px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-sm transition">
                        ⚡ تلقائي
                    </button>
                    <button id="tabManual" class="px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition">
                        📝 يدوي
                    </button>
                </div>

                <button id="btnOpenSettings" class="p-2 text-slate-600 hover:text-emerald-700 hover:bg-slate-100 rounded-full transition" title="إدارة المفاتيح والموديلات">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- مشغل الصوت المدمج -->
        <div id="playerBar" class="max-w-3xl mx-auto px-4 py-2 bg-slate-100/90 border-t border-slate-200 hidden transition-all">
            <div class="flex items-center gap-3">
                <button id="btnPlayerPlay" class="w-9 h-9 flex items-center justify-center rounded-full bg-emerald-600 text-white shadow hover:bg-emerald-700 transition flex-shrink-0">
                    <span id="playerPlayIcon">▶</span>
                </button>

                <button id="btnRewind" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 px-2 py-1.5 rounded-md font-medium text-slate-700 flex items-center gap-0.5">
                    <span>↺</span> <span id="rewindLbl">2s</span>
                </button>
                <button id="btnForward" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 px-2 py-1.5 rounded-md font-medium text-slate-700 flex items-center gap-0.5">
                    <span>↻</span> <span id="forwardLbl">2s</span>
                </button>

                <div class="flex-grow flex items-center gap-2">
                    <span id="currentTimeTxt" class="text-xs font-mono text-slate-500">00:00</span>
                    <input type="range" id="audioSeeker" value="0" min="0" step="0.1" class="w-full h-1.5 bg-slate-300 rounded-lg appearance-none cursor-pointer">
                    <span id="durationTxt" class="text-xs font-mono text-slate-500">00:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-3xl mx-auto px-4 space-y-4">
        
        <!-- بطاقة الاختيار اليدوي -->
        <div id="manualPickerCard" class="hidden bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
            <h3 class="font-bold text-slate-700 text-sm">حدد موضع التلاوة للتسميع:</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
                <div>
                    <label class="block text-slate-500 text-xs mb-1">السورة:</label>
                    <select id="surahSelect" class="w-full p-2 border border-slate-300 rounded-xl bg-slate-50 outline-none"></select>
                </div>
                <div>
                    <label class="block text-slate-500 text-xs mb-1">من آية:</label>
                    <input type="number" id="fromAyah" min="1" value="1" class="w-full p-2 border border-slate-300 rounded-xl bg-slate-50 outline-none">
                </div>
                <div>
                    <label class="block text-slate-500 text-xs mb-1">إلى آية:</label>
                    <input type="number" id="toAyah" min="1" value="5" class="w-full p-2 border border-slate-300 rounded-xl bg-slate-50 outline-none">
                </div>
            </div>
        </div>

        <!-- شريط الحالة والإشعارات -->
        <div id="statusBox" class="bg-white border border-slate-200 text-slate-600 text-sm px-4 py-2.5 rounded-xl shadow-sm flex items-center justify-between">
            <span id="statusTxt" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                جاهز للتسجيل.
            </span>
        </div>

        <!-- لافتة السورة المكتشفة -->
        <div id="detectedBanner" class="hidden bg-emerald-50 border border-emerald-300 text-emerald-900 px-4 py-3 rounded-xl font-medium text-sm shadow-sm"></div>

        <!-- إحصائيات التقييم -->
        <div id="statsBar" class="hidden justify-between items-center bg-white px-4 py-2.5 rounded-xl border border-slate-200 text-sm shadow-sm">
            <span class="font-bold text-slate-700">النتيجة والمطابقة:</span>
            <div class="flex gap-2">
                <span id="correctBadge" class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">✓ صحيح: 0</span>
                <span id="mistakeBadge" class="bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded-full font-bold">✗ تنبيهات: 0</span>
            </div>
        </div>

        <!-- مساحة عرض المصحف الشريف -->
        <div id="unifiedResultArea" class="hidden bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
            <div id="quranContent" class="quran-font text-2xl sm:text-3xl leading-[2.6] text-justify text-slate-800"></div>
        </div>
    </main>

    <!-- شريط التحكم العائم (Floating Dock) -->
    <div id="dockContainer" class="fixed bottom-4 left-0 right-0 z-30 flex flex-col items-center gap-2 px-4 transition-all duration-300">
        
        <button id="btnToggleDock" class="bg-white/90 backdrop-blur-md border border-slate-200 text-slate-600 text-xs px-3 py-1 rounded-full shadow-sm hover:bg-white flex items-center gap-1">
            <span id="toggleIcon">▼</span>
            <span id="toggleText">إخفاء الأزرار</span>
        </button>

        <div id="dockButtons" class="bg-slate-900/90 backdrop-blur-lg border border-slate-700/50 p-2 rounded-2xl shadow-2xl flex flex-wrap items-center justify-center gap-2 max-w-lg w-full transition-all">
            <button id="btnRecord" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-4 py-2.5 rounded-xl flex items-center gap-1.5 shadow transition">
                <span class="text-base">🎙️</span> تسجيل
            </button>

            <button id="btnStop" disabled class="bg-red-600/80 hover:bg-red-600 disabled:opacity-30 text-white font-medium text-sm px-3.5 py-2.5 rounded-xl transition">
                ⏹️ إيقاف
            </button>

            <label id="lblImport" for="fileImport" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-3.5 py-2.5 rounded-xl cursor-pointer flex items-center gap-1 transition">
                <span>📂</span> استيراد
            </label>
            <input type="file" id="fileImport" accept="audio/*" class="hidden">

            <button id="btnSave" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 font-medium text-sm px-3.5 py-2.5 rounded-xl transition" title="حفظ الملف">
                💾 حفظ
            </button>

            <button id="btnUpload" disabled class="bg-amber-600 hover:bg-amber-500 disabled:opacity-30 text-white font-bold text-sm px-4 py-2.5 rounded-xl flex items-center gap-1.5 shadow-lg transition">
                <span>🚀</span> فحص وتقييم
            </button>
        </div>
    </div>

    <!-- نافذة الإعدادات الشاملة (المفاتيح + استعلام الموديلات الحية) -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">⚙️ إدارة المفاتيح والموديلات المتاحة</h3>
                <button id="btnCloseSettings" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <div class="space-y-4 text-sm">
                <!-- قسم إضافة مفتاح جديد -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                    <label class="block font-bold text-slate-700 text-xs">إضافة مفتاح API جديد:</label>
                    <div class="flex gap-2">
                        <input type="password" id="newApiKeyInput" placeholder="AIzaSy..." class="flex-grow p-2 border border-slate-300 rounded-lg text-xs bg-white outline-none focus:ring-2 focus:ring-emerald-500">
                        <button id="btnAddKey" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-bold transition">إضافة</button>
                    </div>
                </div>

                <!-- اختيار المفتاح النشط وقائمته -->
                <div>
                    <label class="block font-bold text-slate-700 mb-1 text-xs">المفتاح النشط المستخدم حالياً:</label>
                    <div class="flex gap-2">
                        <select id="activeKeySelect" class="flex-grow p-2.5 border border-slate-300 rounded-xl bg-slate-50 outline-none font-mono text-xs"></select>
                        <button id="btnDeleteKey" class="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-3 py-2 rounded-xl text-xs font-bold transition" title="حذف المفتاح المحدد">حذف</button>
                    </div>
                </div>

                <!-- قائمة الموديلات التي يتم جلبها تلقائياً من جوجل -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block font-bold text-slate-700 text-xs">الموديل (يتم جلبه تلقائياً من حسابك):</label>
                        <button id="btnRefreshModels" class="text-emerald-600 hover:text-emerald-700 text-xs flex items-center gap-1 font-medium">
                            <span>🔄</span> تحديث الموديلات
                        </button>
                    </div>
                    <select id="modelSelect" class="w-full p-2.5 border border-slate-300 rounded-xl bg-slate-50 outline-none text-xs font-mono"></select>
                    <p id="modelFetchStatus" class="text-[11px] text-slate-400 mt-1"></p>
                </div>
            </div>

            <div class="pt-2 flex justify-end">
                <button id="btnSaveSettings" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium">حفظ وإغلاق</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

<script>
let currentMode = 'auto';
let mediaRecorder = null;
let audioChunks = [];
let currentAudioBlob = null;
let mediaStream = null;
let currentFileName = "recitation.webm";

// إدارة المفاتيح والموديلات المتاحة
let apiKeysList = JSON.parse(localStorage.getItem('gemini_api_keys_list') || '[]');
let activeKey = localStorage.getItem('gemini_active_key') || (apiKeysList[0] || '');
let selectedModel = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';

// عناصر الواجهة
const tabAuto = document.getElementById('tabAuto');
const tabManual = document.getElementById('tabManual');
const manualPickerCard = document.getElementById('manualPickerCard');
const headerSub = document.getElementById('headerSub');
const surahSelect = document.getElementById('surahSelect');
const fromAyah = document.getElementById('fromAyah');
const toAyah = document.getElementById('toAyah');
const lblImport = document.getElementById('lblImport');

const newApiKeyInput = document.getElementById('newApiKeyInput');
const btnAddKey = document.getElementById('btnAddKey');
const activeKeySelect = document.getElementById('activeKeySelect');
const btnDeleteKey = document.getElementById('btnDeleteKey');
const modelSelect = document.getElementById('modelSelect');
const btnRefreshModels = document.getElementById('btnRefreshModels');
const modelFetchStatus = document.getElementById('modelFetchStatus');

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const btnSaveSettings = document.getElementById('btnSaveSettings');

const btnRecord = document.getElementById('btnRecord');
const btnStop = document.getElementById('btnStop');
const btnSave = document.getElementById('btnSave');
const fileImport = document.getElementById('fileImport');
const btnUpload = document.getElementById('btnUpload');

const playerBar = document.getElementById('playerBar');
const audioPlayer = document.getElementById('audioPlayer');
const btnPlayerPlay = document.getElementById('btnPlayerPlay');
const playerPlayIcon = document.getElementById('playerPlayIcon');
const audioSeeker = document.getElementById('audioSeeker');
const currentTimeTxt = document.getElementById('currentTimeTxt');
const durationTxt = document.getElementById('durationTxt');
const btnRewind = document.getElementById('btnRewind');
const btnForward = document.getElementById('btnForward');
const rewindLbl = document.getElementById('rewindLbl');
const forwardLbl = document.getElementById('forwardLbl');

const btnToggleDock = document.getElementById('btnToggleDock');
const dockButtons = document.getElementById('dockButtons');
const toggleIcon = document.getElementById('toggleIcon');
const toggleText = document.getElementById('toggleText');

const statusTxt = document.getElementById('statusTxt');
const detectedBanner = document.getElementById('detectedBanner');
const unifiedResultArea = document.getElementById('unifiedResultArea');
const quranContent = document.getElementById('quranContent');
const statsBar = document.getElementById('statsBar');
const correctBadge = document.getElementById('correctBadge');
const mistakeBadge = document.getElementById('mistakeBadge');

// 1. منطق إدارة المفاتيح والموديلات (التي تم استرجاعها)
function maskKey(key) {
    if (!key || key.length < 8) return key;
    return key.slice(0, 6) + '...' + key.slice(-4);
}

function updateKeysDropdown() {
    activeKeySelect.innerHTML = '';
    if (apiKeysList.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'لا توجد مفاتيح محفوظة';
        activeKeySelect.appendChild(opt);
        modelSelect.innerHTML = '<option value="">يرجى إضافة مفتاح أولاً</option>';
        return;
    }

    apiKeysList.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = maskKey(key);
        if (key === activeKey) opt.selected = true;
        activeKeySelect.appendChild(opt);
    });
}

async function fetchModelsForKey(key) {
    if (!key) return;
    modelFetchStatus.textContent = "⏳ جاري استعلام الموديلات المتاحة لمفتاحك من جوجل...";
    modelSelect.innerHTML = '<option>جاري التحميل...</option>';

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await res.json();
        
        if (data.error) {
            throw new Error(data.error.message);
        }

        // تصفية الموديلات التي تدعم إنشاء وتوليد المحتوى generateContent
        const validModels = (data.models || []).filter(m => 
            m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")
        );

        if (validModels.length === 0) {
            modelSelect.innerHTML = '<option value="gemini-2.5-flash">gemini-2.5-flash (افتراضي)</option>';
            modelFetchStatus.textContent = "⚠️ لم نجد موديلات مخصصة، تم وضع الافتراضي.";
            return;
        }

        modelSelect.innerHTML = '';
        validModels.forEach(m => {
            const cleanName = m.name.replace('models/', '');
            const opt = document.createElement('option');
            opt.value = cleanName;
            opt.textContent = `${cleanName} (${m.displayName || ''})`;
            if (cleanName === selectedModel) opt.selected = true;
            modelSelect.appendChild(opt);
        });

        // إذا لم يكن الموديل المخزن متوفراً، نعتمد أول موديل
        if (!validModels.some(m => m.name.replace('models/', '') === selectedModel)) {
            selectedModel = modelSelect.value;
            localStorage.setItem('gemini_model', selectedModel);
        }

        modelFetchStatus.textContent = `✅ تم جلب ${validModels.length} موديل بنجاح.`;
    } catch (err) {
        console.error("فشل جلب الموديلات:", err);
        modelSelect.innerHTML = `
            <option value="gemini-2.5-flash">gemini-2.5-flash (تلقائي)</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        `;
        modelFetchStatus.textContent = "❌ تعذر جلب الموديلات الحية، تم تفعيل الموديلات القياسية.";
    }
}

// أحداث المفاتيح
btnAddKey.onclick = async () => {
    const val = newApiKeyInput.value.trim();
    if (!val) return;
    if (!apiKeysList.includes(val)) {
        apiKeysList.push(val);
        activeKey = val;
        localStorage.setItem('gemini_api_keys_list', JSON.stringify(apiKeysList));
        localStorage.setItem('gemini_active_key', activeKey);
        updateKeysDropdown();
        newApiKeyInput.value = '';
        await fetchModelsForKey(activeKey);
    }
};

btnDeleteKey.onclick = async () => {
    if (!activeKey) return;
    apiKeysList = apiKeysList.filter(k => k !== activeKey);
    activeKey = apiKeysList[0] || '';
    localStorage.setItem('gemini_api_keys_list', JSON.stringify(apiKeysList));
    localStorage.setItem('gemini_active_key', activeKey);
    updateKeysDropdown();
    if (activeKey) {
        await fetchModelsForKey(activeKey);
    } else {
        modelSelect.innerHTML = '';
    }
};

activeKeySelect.onchange = async () => {
    activeKey = activeKeySelect.value;
    localStorage.setItem('gemini_active_key', activeKey);
    await fetchModelsForKey(activeKey);
};

btnRefreshModels.onclick = () => {
    if (activeKey) fetchModelsForKey(activeKey);
};

modelSelect.onchange = () => {
    selectedModel = modelSelect.value;
    localStorage.setItem('gemini_model', selectedModel);
};

btnOpenSettings.onclick = () => settingsModal.classList.remove('hidden');
btnCloseSettings.onclick = () => settingsModal.classList.add('hidden');
btnSaveSettings.onclick = () => {
    settingsModal.classList.add('hidden');
};

// تهيئة المفاتيح عند الإقلاع
updateKeysDropdown();
if (activeKey) {
    fetchModelsForKey(activeKey);
}

// 2. التبديل بين التلقائي واليدوي
tabAuto.onclick = () => {
    currentMode = 'auto';
    tabAuto.className = "px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-sm transition";
    tabManual.className = "px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition";
    headerSub.textContent = "الوضع: كشف تلقائي";
    manualPickerCard.classList.add('hidden');
    lblImport.classList.remove('hidden');
};

tabManual.onclick = () => {
    currentMode = 'manual';
    tabManual.className = "px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-sm transition";
    tabAuto.className = "px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition";
    headerSub.textContent = "الوضع: تحديد يدوي";
    manualPickerCard.classList.remove('hidden');
    lblImport.classList.add('hidden');
};

// ملء قائمة السور للوضع اليدوي
async function loadSurahs() {
    try {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const data = await res.json();
        surahSelect.innerHTML = data.chapters.map(c => `<option value="${c.id}" data-verses="${c.verses_count}">${c.id}. سورة ${c.name_arabic}</option>`).join('');
        updateAyahBounds();
    } catch (e) {
        console.warn("تعذر تحميل السور مسبقاً:", e);
    }
}
function updateAyahBounds() {
    const selected = surahSelect.options[surahSelect.selectedIndex];
    if (!selected) return;
    const count = parseInt(selected.getAttribute('data-verses') || 7);
    fromAyah.max = count;
    toAyah.max = count;
}
surahSelect.onchange = updateAyahBounds;
loadSurahs();

// 3. كبسولة التحكم والعرض المريح
let dockVisible = true;
btnToggleDock.onclick = () => {
    dockVisible = !dockVisible;
    if (dockVisible) {
        dockButtons.classList.remove('hidden');
        toggleIcon.textContent = "▼";
        toggleText.textContent = "إخفاء الأزرار";
    } else {
        dockButtons.classList.add('hidden');
        toggleIcon.textContent = "▲";
        toggleText.textContent = "إظهار الأزرار";
    }
};

// مشغل الصوت التفاعلي
function formatTime(sec) {
    if (isNaN(sec)) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

btnPlayerPlay.onclick = () => {
    if (audioPlayer.paused) {
        audioPlayer.play();
        playerPlayIcon.textContent = "⏸";
    } else {
        audioPlayer.pause();
        playerPlayIcon.textContent = "▶";
    }
};

audioPlayer.ontimeupdate = () => {
    audioSeeker.value = audioPlayer.currentTime;
    currentTimeTxt.textContent = formatTime(audioPlayer.currentTime);
};

audioPlayer.onloadedmetadata = () => {
    audioSeeker.max = audioPlayer.duration;
    durationTxt.textContent = formatTime(audioPlayer.duration);
};

audioPlayer.onended = () => { playerPlayIcon.textContent = "▶"; };
audioSeeker.oninput = () => { audioPlayer.currentTime = audioSeeker.value; };

let rewindClicks = 0, rewindTimer = null;
btnRewind.onclick = () => {
    rewindClicks++;
    clearTimeout(rewindTimer);
    const step = rewindClicks === 1 ? 2 : rewindClicks === 2 ? 5 : 10;
    rewindLbl.textContent = `${step}s`;
    audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - step);
    rewindTimer = setTimeout(() => { rewindClicks = 0; rewindLbl.textContent = "2s"; }, 1200);
};

let forwardClicks = 0, forwardTimer = null;
btnForward.onclick = () => {
    forwardClicks++;
    clearTimeout(forwardTimer);
    const step = forwardClicks === 1 ? 2 : forwardClicks === 2 ? 5 : 10;
    forwardLbl.textContent = `${step}s`;
    audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + step);
    forwardTimer = setTimeout(() => { forwardClicks = 0; forwardLbl.textContent = "2s"; }, 1200);
};

// 4. التسجيل وحفظ الصوت
btnSave.onclick = () => {
    if (!currentAudioBlob) return;
    const url = URL.createObjectURL(currentAudioBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    statusTxt.textContent = `💾 تم تنزيل الملف: ${currentFileName}`;
};

fileImport.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    currentAudioBlob = file;
    currentFileName = file.name;
    btnSave.disabled = false;
    btnUpload.disabled = false;

    audioPlayer.src = URL.createObjectURL(file);
    playerBar.classList.remove('hidden');
    playerPlayIcon.textContent = "▶";
    statusTxt.textContent = `📁 تم استيراد: ${file.name}`;
});

btnRecord.onclick = async () => {
    try {
        if (!audioPlayer.paused) audioPlayer.pause();

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let options = {};
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType: 'audio/webm;codecs=opus' };
        else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
        else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

        mediaRecorder = new MediaRecorder(mediaStream, options);
        audioChunks = [];
        currentAudioBlob = null;

        btnSave.disabled = true;
        btnUpload.disabled = true;

        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const actualType = mediaRecorder.mimeType || 'audio/webm';
            currentAudioBlob = new Blob(audioChunks, { type: actualType });
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            currentFileName = `تلاوة_${timestamp}.${actualType.includes('mp4') ? 'm4a' : 'webm'}`;

            btnRecord.disabled = false;
            btnStop.disabled = true;
            btnSave.disabled = false;
            btnUpload.disabled = false;

            audioPlayer.src = URL.createObjectURL(currentAudioBlob);
            playerBar.classList.remove('hidden');
            playerPlayIcon.textContent = "▶";

            statusTxt.textContent = "✅ تم التسجيل، اضغط فحص وتقييم للبدء.";
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
        };

        mediaRecorder.start(250);
        btnRecord.disabled = true;
        btnStop.disabled = false;
        statusTxt.textContent = "🔴 جاري التسجيل.. اتلُ الآن.";
    } catch (err) {
        console.error(err);
        alert("تعذر فتح المايكروفون: " + err.message);
        btnRecord.disabled = false;
        btnStop.disabled = true;
    }
};

btnStop.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
};

// 5. أدوات المقارنة والتنظيف
function cleanArabic(text) {
    if (!text) return "";
    return text
        .replace(/[\u06D6-\u06ED\u0610-\u0615ۖۗۘۙۚۛۜ۞۩]/g, '')
        .replace(/[\u0617-\u061A\u064B-\u0652\u0670]/g, '')
        .replace(/[إأآاٱ]/g, 'ا')
        .replace(/[يى]/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[ؤءئ]/g, '')
        .replace(/وو+/g, 'و')
        .replace(/\s+/g, ' ')
        .trim();
}

function toArabicNumber(n) {
    const farsi = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    return n.toString().replace(/\d/g, x => farsi[x]);
}

function getDiffOpcodes(a, b) {
    const N = a.length, M = b.length;
    const dp = Array.from({length: N + 1}, () => new Uint16Array(M + 1));
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
            if (a[i] === b[j]) dp[i+1][j+1] = dp[i][j] + 1;
            else dp[i+1][j+1] = Math.max(dp[i+1][j], dp[i][j+1]);
        }
    }
    const ops = [];
    let i = N, j = M;
    while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
            ops.push({tag: 'equal', i1: i-1, i2: i, j1: j-1, j2: j});
            i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
            ops.push({tag: 'insert', i1: i, i2: i, j1: j-1, j2: j});
            j--;
        } else {
            ops.push({tag: 'delete', i1: i-1, i2: i, j1: j, j2: j});
            i--;
        }
    }
    ops.reverse();

    const merged = [];
    for (const op of ops) {
        const last = merged[merged.length - 1];
        if (last && last.tag === op.tag && last.i2 === op.i1 && last.j2 === op.j1) {
            last.i2 = op.i2;
            last.j2 = op.j2;
        } else {
            merged.push({...op});
        }
    }

    const finalOps = [];
    for (let k = 0; k < merged.length; k++) {
        const curr = merged[k];
        const next = merged[k+1];
        if (next && ((curr.tag === 'delete' && next.tag === 'insert') || (curr.tag === 'insert' && next.tag === 'delete'))) {
            finalOps.push({
                tag: 'replace',
                i1: Math.min(curr.i1, next.i1),
                i2: Math.max(curr.i2, next.i2),
                j1: Math.min(curr.j1, next.j1),
                j2: Math.max(curr.j2, next.j2)
            });
            k++;
        } else {
            finalOps.push(curr);
        }
    }
    return finalOps;
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

// 6. الفحص والمطابقة
btnUpload.onclick = async () => {
    if (!activeKey) {
        settingsModal.classList.remove('hidden');
        alert("يرجى إضافة أو اختيار مفتاح API أولاً من الإعدادات!");
        return;
    }

    const targetModel = selectedModel || 'gemini-2.5-flash';
    statusTxt.textContent = "🔍 جاري تحليل الصوت وفحص التلاوة...";
    btnUpload.disabled = true;

    try {
        const base64Audio = await blobToBase64(currentAudioBlob);
        const mimeType = currentAudioBlob.type.split(';')[0] || 'audio/webm';

        let promptInstruction = "";
        if (currentMode === 'auto') {
            promptInstruction = `
أنت خبير في الاستماع لتلاوات القرآن الكريم.
1. استمع للتسجيل.
2. حدد النية (intent): "display_only" إذا طلب فقط عرض السورة بالاسم، أو "recite" إذا كان يتلو قرآناً.
3. استخرج: surah_number (1-114), surah_name, start_ayah, end_ayah.
4. فرّغ النص الصوتي كاملاً بدقة دون تصحيح إملائي أو تجويدي من حفظك وبدون تشكيل.
5. أخرج بصيغة JSON فقط:
{
  "intent": "recite",
  "surah_number": 1,
  "start_ayah": 1,
  "end_ayah": 7,
  "surah_name": "الفاتحة",
  "transcription": "..."
}`;
        } else {
            const sNum = surahSelect.value;
            const sName = surahSelect.options[surahSelect.selectedIndex].text;
            const sAyah = parseInt(fromAyah.value);
            const eAyah = parseInt(toAyah.value);
            promptInstruction = `
المستخدم يتلو من سورة ${sName} الآيات من ${sAyah} إلى ${eAyah}.
فرّغ الصوت بدقة تامة كما نطق بدون أي تشكيل وبدون تصحيح من حفظك.
الإخراج بصيغة JSON فقط:
{
  "intent": "recite",
  "surah_number": ${sNum},
  "start_ayah": ${sAyah},
  "end_ayah": ${eAyah},
  "surah_name": "${sName}",
  "transcription": "..."
}`;
        }

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${activeKey}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptInstruction }, { inline_data: { mime_type: mimeType, data: base64Audio } }] }],
                generationConfig: { temperature: 0.0, response_mime_type: "application/json" }
            })
        });

        const geminiData = await res.json();
        if (geminiData.error) throw new Error(geminiData.error.message);

        const parsed = JSON.parse(geminiData.candidates[0].content.parts[0].text);
        const { surah_number, start_ayah, end_ayah, surah_name, intent, transcription } = parsed;

        statusTxt.textContent = "⏳ جاري مطابقة الآيات مع المصحف...";

        const refWords = [];
        for (let a = start_ayah; a <= end_ayah; a++) {
            const apiRes = await fetch(`https://api.quran.com/api/v4/verses/by_key/${surah_number}:${a}?words=true&word_fields=text_imlaei,text_uthmani,position`);
            const json = await apiRes.json();
            for (const w of json.verse.words) {
                if (w.char_type_name === "word") {
                    refWords.push({
                        verse_key: `${surah_number}:${a}`,
                        text_uthmani: w.text_uthmani,
                        text_imlaei: w.text_imlaei
                    });
                }
            }
        }

        const flatReferenceWords = [];
        for (let idx = 0; idx < refWords.length; idx++) {
            const item = refWords[idx];
            const subWords = (item.text_imlaei || '').split(/\s+/).filter(Boolean);
            for (let sIdx = 0; sIdx < subWords.length; sIdx++) {
                const sub = subWords[sIdx];
                if (cleanArabic(sub)) {
                    const displayUthmani = (sIdx === 0) ? item.text_uthmani : "";
                    const isLastInVerse = (sIdx === subWords.length - 1) && 
                        (idx === refWords.length - 1 || refWords[idx+1].verse_key !== item.verse_key);
                    
                    const ayahNum = item.verse_key.split(':')[1];
                    const ayahMarker = isLastInVerse ? ` <span class="text-amber-600 font-sans text-lg">﴿${toArabicNumber(ayahNum)}﴾</span>` : "";

                    flatReferenceWords.push({
                        verse_key: item.verse_key,
                        text_uthmani: displayUthmani,
                        text_imlaei_single: sub,
                        ayah_marker: ayahMarker
                    });
                }
            }
        }

        detectedBanner.classList.remove('hidden');
        detectedBanner.innerHTML = `🎯 الموضع: <strong>سورة ${surah_name}</strong> (الآيات ${start_ayah} - ${end_ayah})`;

        const recitedWords = (transcription || "").split(/\s+/).filter(Boolean);
        const cleanRef = flatReferenceWords.map(w => cleanArabic(w.text_imlaei_single));
        const cleanRec = recitedWords.map(w => cleanArabic(w));
        const opcodes = getDiffOpcodes(cleanRef, cleanRec);

        let correctCount = 0, mistakesCount = 0;
        let finalUnifiedHtml = "";

        for (const op of opcodes) {
            if (op.tag === 'equal') {
                for (let idx = op.i1; idx < op.i2; idx++) {
                    correctCount++;
                    const item = flatReferenceWords[idx];
                    if (item.text_uthmani) finalUnifiedHtml += `<span class="text-slate-800">${item.text_uthmani}</span> `;
                    if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                }
            } else if (op.tag === 'replace') {
                const refLen = op.i2 - op.i1, recLen = op.j2 - op.j1;
                const maxLen = Math.max(refLen, recLen);
                mistakesCount += recLen;

                for (let k = 0; k < maxLen; k++) {
                    const item = k < refLen ? flatReferenceWords[op.i1 + k] : null;
                    const recW = k < recLen ? recitedWords[op.j1 + k] : null;

                    if (item && recW) {
                        finalUnifiedHtml += `<span class="bg-red-100 text-red-700 border-b-2 border-red-500 px-1 rounded cursor-help" title="نطقت: ${recW}">${item.text_uthmani}</span> `;
                        if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                    } else if (item && !recW) {
                        finalUnifiedHtml += `<span class="bg-red-50 text-red-600 border-b-2 border-dashed border-red-400 px-1 rounded cursor-help" title="منسية">${item.text_uthmani}</span> `;
                        if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                    } else if (!item && recW) {
                        finalUnifiedHtml += `<span class="bg-amber-100 text-amber-800 border border-amber-400 text-base font-sans px-1.5 py-0.5 rounded cursor-help" title="زيادة">+ (${recW})</span> `;
                    }
                }
            } else if (op.tag === 'delete') {
                mistakesCount += (op.i2 - op.i1);
                for (let idx = op.i1; idx < op.i2; idx++) {
                    const item = flatReferenceWords[idx];
                    if (item.text_uthmani) finalUnifiedHtml += `<span class="bg-red-50 text-red-600 border-b-2 border-dashed border-red-400 px-1 rounded cursor-help" title="منسية">${item.text_uthmani}</span> `;
                    if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                }
            } else if (op.tag === 'insert') {
                mistakesCount += (op.j2 - op.j1);
                for (let idx = op.j1; idx < op.j2; idx++) {
                    finalUnifiedHtml += `<span class="bg-amber-100 text-amber-800 border border-amber-400 text-base font-sans px-1.5 py-0.5 rounded cursor-help" title="زيادة">+ (${recitedWords[idx]})</span> `;
                }
            }
        }

        correctBadge.textContent = `✓ صحيح: ${correctCount}`;
        mistakeBadge.textContent = `✗ تنبيهات: ${mistakesCount}`;
        statsBar.classList.remove('hidden');
        statsBar.classList.add('flex');

        quranContent.innerHTML = finalUnifiedHtml;
        unifiedResultArea.classList.remove('hidden');
        statusTxt.textContent = "✅ اكتمل التقييم بنجاح!";
    } catch (err) {
        console.error(err);
        statusTxt.textContent = `❌ خطأ: ${err.message}`;
    } finally {
        btnUpload.disabled = false;
    }
};
</script>
