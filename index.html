<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسمّع القرآني الشامل</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23059669%22/><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2260%22>📖</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .quran-font { 
            font-family: 'Amiri', serif; 
            line-height: 3.4 !important; /* مسافة أسطر واسعة ومريحة جداً للشاشات الكبيرة */
            word-spacing: 6px;
        }
        @media (max-width: 640px) {
            .quran-font {
                line-height: 2.8 !important;
                word-spacing: 3px;
            }
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #059669;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-36">

    <!-- 1. شريط التنقل العلوي -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm mb-4">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📖</span>
                <div>
                    <h1 class="text-base font-bold text-emerald-800 leading-tight">المسمّع القرآني الذكي</h1>
                    <span id="headerSub" class="text-xs text-slate-500 font-medium">الوضع: كشف تلقائي</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- مبدل الأنماط -->
                <div class="bg-slate-100 p-1 rounded-xl flex items-center gap-1 border border-slate-200 text-xs">
                    <button id="tabAuto" class="px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-sm transition">✨ كشف ذكي</button>
                    <button id="tabManual" class="px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition">📝 يدوي</button>
                </div>

                <!-- زر الإعدادات والـ API -->
                <button id="btnOpenSettings" class="p-2 text-slate-600 hover:text-emerald-700 hover:bg-slate-100 rounded-full transition" title="إدارة المفاتيح والموديلات">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- مشغل الصوت المدمج -->
        <div id="playerBar" class="max-w-4xl mx-auto px-4 py-2 bg-slate-100/90 border-t border-slate-200 hidden transition-all">
            <div class="flex items-center gap-3">
                <button id="btnPlayerPlay" class="w-9 h-9 flex items-center justify-center rounded-full bg-emerald-600 text-white shadow hover:bg-emerald-700 transition flex-shrink-0">
                    <span id="playerPlayIcon">▶</span>
                </button>

                <button id="btnRewind" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 px-2 py-1.5 rounded-md font-medium text-slate-700 flex items-center gap-0.5">
                    <span>↺</span> <span id="rewindLbl">2s</span>
                </button>
                <button id="btnForward" class="text-xs bg-white border border-slate-300 hover:bg-slate-50 px-2 py-1.5 rounded-md font-medium text-slate-700 flex items-center gap-0.5">
                    <span>↻</span> <span id="forwardLbl">2s</span>
                </button>

                <div class="flex-grow flex items-center gap-2">
                    <span id="currentTimeTxt" class="text-xs font-mono text-slate-500">00:00</span>
                    <input type="range" id="audioSeeker" value="0" min="0" step="0.1" class="w-full h-1.5 bg-slate-300 rounded-lg appearance-none cursor-pointer">
                    <span id="durationTxt" class="text-xs font-mono text-slate-500">00:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. المحتوى الرئيسي -->
    <main class="max-w-4xl mx-auto px-4 space-y-4">
        
        <!-- حقول التحديد اليدوي -->
        <div id="manualPickerCard" class="hidden bg-white border border-slate-200 rounded-2xl p-4 shadow-sm transition">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">السورة الكريمة:</label>
                    <select id="surahSelect" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">من الآية:</label>
                    <input type="number" id="fromAyah" min="1" value="1" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">إلى الآية:</label>
                    <input type="number" id="toAyah" min="1" value="5" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>
        </div>

        <!-- لافتة التنبيهات والحالة -->
        <div id="statusBox" class="bg-white border border-slate-200 text-slate-600 text-sm px-4 py-2.5 rounded-xl shadow-sm flex items-center justify-between">
            <span id="statusTxt" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                جاهز. اتلُ تلاوتك أو استورد تسجيلاً للتحليل.
            </span>
            <span id="activeKeyIndicator" class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-mono"></span>
        </div>

        <div id="detectedBanner" class="hidden bg-emerald-50 border border-emerald-300 text-emerald-900 px-4 py-3 rounded-xl font-medium text-sm flex items-center gap-2 shadow-sm"></div>

        <!-- شريط الإحصائيات -->
        <div id="statsBar" class="hidden justify-between items-center bg-white px-4 py-2.5 rounded-xl border border-slate-200 text-sm shadow-sm">
            <span class="font-bold text-slate-700">النتيجة والتقييم:</span>
            <div class="flex gap-2">
                <span id="correctBadge" class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">✓ صحيح: 0</span>
                <span id="mistakeBadge" class="bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded-full font-bold">✗ تنبيهات: 0</span>
            </div>
        </div>

        <!-- مساحة عرض المصحف -->
        <div id="unifiedResultArea" class="hidden bg-white border border-slate-200 rounded-2xl p-6 sm:p-10 shadow-sm">
            <div id="quranContent" class="quran-font text-2xl sm:text-3xl text-justify text-slate-800 selection:bg-emerald-100"></div>
        </div>
    </main>

    <!-- 3. كبسولة التحكم العائمة (Floating Dock) -->
    <div id="dockContainer" class="fixed bottom-4 left-0 right-0 z-30 flex flex-col items-center gap-2 px-4 transition-all duration-300">
        
        <button id="btnToggleDock" class="bg-white/80 backdrop-blur-md border border-slate-200 text-slate-600 text-xs px-3 py-1 rounded-full shadow-sm hover:bg-white flex items-center gap-1">
            <span id="toggleIcon">▼</span>
            <span id="toggleText">إخفاء الأزرار للقراءة</span>
        </button>

        <div id="dockButtons" class="bg-slate-900/90 backdrop-blur-lg border border-slate-700/50 p-2 rounded-2xl shadow-2xl flex flex-wrap items-center justify-center gap-2 max-w-lg w-full transition-all">
            
            <button id="btnRecord" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-4 py-2.5 rounded-xl flex items-center gap-1.5 shadow transition">
                <span class="text-base">🎙️</span> تسجيل
            </button>

            <button id="btnStop" disabled class="bg-red-600/80 hover:bg-red-600 disabled:opacity-30 text-white font-medium text-sm px-3.5 py-2.5 rounded-xl transition">
                ⏹️ إيقاف
            </button>

            <label id="lblImport" for="fileImport" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-3.5 py-2.5 rounded-xl cursor-pointer flex items-center gap-1 transition">
                <span>📂</span> استيراد
            </label>
            <input type="file" id="fileImport" accept="audio/*,video/webm,audio/webm,.webm,.m4a,.mp3,.wav" class="hidden">

            <button id="btnSave" disabled class="bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 font-medium text-sm px-3.5 py-2.5 rounded-xl transition" title="حفظ التسجيل على الهاتف">
                💾 حفظ
            </button>

            <button id="btnUpload" disabled class="bg-amber-600 hover:bg-amber-500 disabled:opacity-30 text-white font-bold text-sm px-4 py-2.5 rounded-xl flex items-center gap-1.5 shadow-lg transition">
                <span>🚀</span> فحص وتقييم
            </button>
        </div>
    </div>

    <!-- 4. نافذة الإعدادات وإدارة المفاتيح والموديلات -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">⚙️ إدارة المفاتيح والموديلات</h3>
                <button id="btnCloseSettings" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <!-- قسم إدارة المفاتيح -->
            <div class="space-y-3">
                <label class="block font-bold text-slate-700 text-xs">مفتاح API النشط حالياً:</label>
                <div class="flex gap-2">
                    <select id="activeKeySelect" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-slate-50 outline-none"></select>
                    <button id="btnDeleteKey" class="p-2 text-red-600 hover:bg-red-50 rounded-lg border border-red-200" title="حذف المفتاح المختار">🗑️</button>
                </div>

                <!-- إضافة مفتاح جديد -->
                <div class="p-3 bg-slate-50 border border-dashed border-slate-300 rounded-xl space-y-2">
                    <span class="text-xs font-bold text-slate-600">إضافة مفتاح إضافي (+):</span>
                    <div class="flex gap-2">
                        <input type="text" id="newKeyName" placeholder="اسم رمزي (مثلاً: حساب 2)" class="w-1/3 p-2 border border-slate-300 rounded-lg text-xs bg-white outline-none">
                        <input type="password" id="newKeyValue" placeholder="AIzaSy..." class="w-2/3 p-2 border border-slate-300 rounded-lg text-xs bg-white outline-none">
                    </div>
                    <button id="btnAddKey" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-1.5 rounded-lg transition">+ فحص وحفظ المفتاح</button>
                </div>
            </div>

            <!-- قسم اختيار الموديل الديناميكي -->
            <div class="space-y-2 text-sm pt-2 border-t">
                <div class="flex justify-between items-center">
                    <label class="block font-bold text-slate-700 text-xs">الموديل المستخدم:</label>
                    <button id="btnRefreshModels" class="text-[11px] text-emerald-700 hover:underline">🔄 تحديث الموديلات</button>
                </div>
                <select id="modelSelect" class="w-full p-2.5 border border-slate-300 rounded-lg text-xs bg-slate-50 outline-none font-medium">
                    <option value="">جاري فحص الموديلات المتاحة...</option>
                </select>
                <p id="modelStatusHint" class="text-[11px] text-slate-500">سيتم تفعيل التبديل التلقائي (Fallback) إذا واجه الموديل أي ضغط.</p>
            </div>

            <div class="pt-3 flex justify-end">
                <button id="btnSaveSettings" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium">إغلاق وحفظ</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

<script>
// قائمة السور الكريمة
const SURAHS = [
    {id: 1, name: "الفاتحة", verses: 7}, {id: 2, name: "البقرة", verses: 286}, {id: 3, name: "آل عمران", verses: 200},
    {id: 4, name: "النساء", verses: 176}, {id: 5, name: "المائدة", verses: 120}, {id: 6, name: "الأنعام", verses: 165},
    {id: 7, name: "الأعراف", verses: 206}, {id: 8, name: "الأنفال", verses: 75}, {id: 9, name: "التوبة", verses: 129},
    {id: 10, name: "يونس", verses: 109}, {id: 11, name: "هود", verses: 123}, {id: 12, name: "يوسف", verses: 111},
    {id: 13, name: "الرعد", verses: 43}, {id: 14, name: "إبراهيم", verses: 52}, {id: 15, name: "الحجر", verses: 99},

    {id: 25, name: "الفرقان", verses: 77}, {id: 26, name: "الشعراء", verses: 227}, {id: 27, name: "النمل", verses: 93},
    {id: 28, name: "القصص", verses: 88}, {id: 29, name: "العنكبوت", verses: 69}, {id: 30, name: "الروم", verses: 60},
    {id: 31, name: "لقمان", verses: 34}, {id: 32, name: "السجدة", verses: 30}, {id: 33, name: "الأحزاب", verses: 73},
    {id: 34, name: "سبأ", verses: 54}, {id: 35, name: "فاطر", verses: 45}, {id: 36, name: "يس", verses: 83},
    {id: 37, name: "الصافات", verses: 182}, {id: 38, name: "ص", verses: 88}, {id: 39, name: "الزمر", verses: 75},
    {id: 40, name: "غافر", verses: 85}, {id: 41, name: "فصلت", verses: 54}, {id: 42, name: "الشورى", verses: 53},
    {id: 43, name: "الزخرف", verses: 89}, {id: 44, name: "الدخان", verses: 59}, {id: 45, name: "الجاثية", verses: 37},
    {id: 46, name: "الأحقاف", verses: 35}, {id: 47, name: "محمد", verses: 38}, {id: 48, name: "الفتح", verses: 29},
    {id: 49, name: "الحجرات", verses: 18}, {id: 50, name: "ق", verses: 45}, {id: 51, name: "الذاريات", verses: 60},
    {id: 52, name: "الطور", verses: 49}, {id: 53, name: "النجم", verses: 62}, {id: 54, name: "القمر", verses: 55},
    {id: 55, name: "الرحمن", verses: 78}, {id: 56, name: "الواقعة", verses: 96}, {id: 57, name: "الحديد", verses: 29},
    {id: 58, name: "المجادلة", verses: 22}, {id: 59, name: "الحشر", verses: 24}, {id: 60, name: "الممتحنة", verses: 13},

    {id: 76, name: "الإنسان", verses: 31}, {id: 77, name: "المرسلات", verses: 50}, {id: 78, name: "النبأ", verses: 40},
    {id: 79, name: "النازعات", verses: 46}, {id: 80, name: "عبس", verses: 42}, {id: 81, name: "التكوير", verses: 29},

    {id: 91, name: "الشمس", verses: 15}, {id: 92, name: "الليل", verses: 21}, {id: 93, name: "الضحى", verses: 11},
    {id: 94, name: "الشرح", verses: 8}, {id: 95, name: "التين", verses: 8}, {id: 96, name: "العلق", verses: 19},

    {id: 112, name: "الإخلاص", verses: 4}, {id: 113, name: "الفلق", verses: 5}, {id: 114, name: "الناس", verses: 6}
];

let currentMode = 'auto';
const tabAuto = document.getElementById('tabAuto');
const tabManual = document.getElementById('tabManual');
const headerSub = document.getElementById('headerSub');
const manualPickerCard = document.getElementById('manualPickerCard');
const lblImport = document.getElementById('lblImport');
const surahSelect = document.getElementById('surahSelect');
const fromAyah = document.getElementById('fromAyah');
const toAyah = document.getElementById('toAyah');

SURAHS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.id}. سورة ${s.name} (${s.verses} آية)`;
    surahSelect.appendChild(opt);
});

function updateAyahBounds() {
    const s = SURAHS.find(x => x.id === parseInt(surahSelect.value));
    fromAyah.max = s.verses;
    toAyah.max = s.verses;
    if (parseInt(fromAyah.value) > s.verses) fromAyah.value = 1;
    if (parseInt(toAyah.value) > s.verses) toAyah.value = Math.min(5, s.verses);
}
surahSelect.addEventListener('change', updateAyahBounds);
updateAyahBounds();

tabAuto.onclick = () => {
    currentMode = 'auto';
    tabAuto.className = "px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-sm transition";
    tabManual.className = "px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition";
    headerSub.textContent = "الوضع: كشف تلقائي";
    manualPickerCard.classList.add('hidden');
    lblImport.classList.remove('hidden');
};

tabManual.onclick = () => {
    currentMode = 'manual';
    tabManual.className = "px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white shadow-sm transition";
    tabAuto.className = "px-3 py-1.5 rounded-lg font-bold text-slate-600 hover:text-slate-900 transition";
    headerSub.textContent = "الوضع: تحديد يدوي";
    manualPickerCard.classList.remove('hidden');
    lblImport.classList.add('hidden');
};

// ----------------------------------------------------
// إدارة المفاتيح والموديلات الديناميكية
// ----------------------------------------------------
let apiKeys = JSON.parse(localStorage.getItem('gemini_api_keys') || '[]');
if (apiKeys.length === 0 && localStorage.getItem('gemini_api_key')) {
    apiKeys.push({ name: 'مفتاحي الرئيسي', key: localStorage.getItem('gemini_api_key') });
    localStorage.setItem('gemini_api_keys', JSON.stringify(apiKeys));
}

let activeKeyIndex = parseInt(localStorage.getItem('gemini_active_key_index') || '0');
if (activeKeyIndex >= apiKeys.length) activeKeyIndex = 0;

const activeKeySelect = document.getElementById('activeKeySelect');

const btnDeleteKey = document.getElementById('btnDeleteKey');

function updateModelSelectUI(models) {
    modelSelect.innerHTML = '';
    if (!models || models.length === 0) {
        modelSelect.innerHTML = '<option value="">لا توجد موديلات متاحة</option>';
        return;
    }

    const savedModel = localStorage.getItem('gemini_model');
    models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + (m.includes('flash') ? ' (سريع وموصى به)' : '');
        if (m === savedModel) opt.selected = true;
        modelSelect.appendChild(opt);
    });

    if (!modelSelect.value && models.length > 0) {
        modelSelect.value = models[0];
        localStorage.setItem('gemini_model', models[0]);
    }
}

async function fetchValidAudioModels(apiKey) {
    if (!apiKey) return [];
    const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`كود: ${response.status}`);

        const data = await response.json();
        const rawModels = data.models || [];

        const filtered = rawModels
            .filter(m => {
                const name = m.name.toLowerCase();
                const methods = m.supportedGenerationMethods || [];
                const supportsGenerate = methods.includes("generateContent");
                const isGeminiFamily = name.includes("gemini");
                const isExcluded = name.includes("image") || 
                                   name.includes("tts") || 
                                   name.includes("robotics") || 
                                   name.includes("computer-use");
                return supportsGenerate && isGeminiFamily && !isExcluded;
            })
            .map(m => m.name.replace("models/", ""));

        // ترتيب الموديلات السريعة Flash أولاً
        filtered.sort((a, b) => {
            const aFlash = a.includes("flash") ? 1 : 0;
            const bFlash = b.includes("flash") ? 1 : 0;
            return bFlash - aFlash;
        });

        dynamicAudioModels = filtered.length > 0 ? filtered : ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
        updateModelSelectUI(dynamicAudioModels);
        modelStatusHint.textContent = `✅ تم تفعيل ${dynamicAudioModels.length} موديل متوافق مع الصوتيات.`;
        return dynamicAudioModels;

    } catch (err) {
        clearTimeout(timeoutId);
        console.warn("فشل كشف الموديلات، الاعتماد على القائمة الافتراضية:", err);
        dynamicAudioModels = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
        updateModelSelectUI(dynamicAudioModels);
        modelStatusHint.textContent = "⚠️ استخدمنا قائمة الموديلات الافتراضية.";
        return dynamicAudioModels;
    }
}

async function refreshKeyUI(fetchModels = true) {
    activeKeySelect.innerHTML = '';
    if (apiKeys.length === 0) {
        activeKeySelect.innerHTML = '<option value="">لا يوجد مفاتيح مضافة</option>';
        activeKeyIndicator.textContent = '⚠️ بدون مفتاح API';
        updateModelSelectUI([]);
        return;
    }

    apiKeys.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${item.name} (${item.key.slice(0, 6)}...${item.key.slice(-4)})`;
        if (idx === activeKeyIndex) opt.selected = true;
        activeKeySelect.appendChild(opt);
    });

    const curr = apiKeys[activeKeyIndex];
    activeKeyIndicator.textContent = `🔑 ${curr.name}`;

    if (fetchModels && curr?.key) {
        await fetchValidAudioModels(curr.key);
    }
}

activeKeySelect.onchange = async () => {
    activeKeyIndex = parseInt(activeKeySelect.value);
    localStorage.setItem('gemini_active_key_index', activeKeyIndex);
    await refreshKeyUI(true);
};

btnAddKey.onclick = async () => {
    const val = newKeyValue.value.trim();
    const name = newKeyName.value.trim() || `مفتاح ${apiKeys.length + 1}`;
    if (!val) {
        alert("يرجى إدخال المفتاح أولاً!");
        return;
    }
    
    btnAddKey.disabled = true;
    btnAddKey.textContent = "⏳ جاري فحص صلاحية المفتاح...";

    const models = await fetchValidAudioModels(val);
    btnAddKey.disabled = false;
    btnAddKey.textContent = "+ فحص وحفظ المفتاح";

    if (models.length === 0) {
        alert("المفتاح غير صالح أو تعذر الاتصال بسيرفرات جوجل!");
        return;
    }

    apiKeys.push({ name, key: val });
    activeKeyIndex = apiKeys.length - 1;
    localStorage.setItem('gemini_api_keys', JSON.stringify(apiKeys));
    localStorage.setItem('gemini_active_key_index', activeKeyIndex);
    newKeyName.value = '';
    newKeyValue.value = '';
    await refreshKeyUI(false);
    alert(`✅ تم حفظ وتفعيل المفتاح وتوفير ${models.length} موديل بنجاح!`);
};

btnDeleteKey.onclick = async () => {
    if (apiKeys.length === 0) return;
    if (confirm("هل أنت متأكد من حذف هذا المفتاح؟")) {
        apiKeys.splice(activeKeyIndex, 1);
        activeKeyIndex = Math.max(0, apiKeys.length - 1);
        localStorage.setItem('gemini_api_keys', JSON.stringify(apiKeys));
        localStorage.setItem('gemini_active_key_index', activeKeyIndex);
        await refreshKeyUI(true);
    }
};

function formatTime(sec) {
    if (isNaN(sec)) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

btnPlayerPlay.onclick = () => {
    if (audioPlayer.paused) {
        audioPlayer.play();
        playerPlayIcon.textContent = "⏸";
    } else {
        audioPlayer.pause();
        playerPlayIcon.textContent = "▶";
    }
};

audioPlayer.ontimeupdate = () => {
    audioSeeker.value = audioPlayer.currentTime;
    currentTimeTxt.textContent = formatTime(audioPlayer.currentTime);
};

audioPlayer.onloadedmetadata = () => {
    audioSeeker.max = audioPlayer.duration;
    durationTxt.textContent = formatTime(audioPlayer.duration);
};

audioPlayer.onended = () => { playerPlayIcon.textContent = "▶"; };
audioSeeker.oninput = () => { audioPlayer.currentTime = audioSeeker.value; };

let rewindClicks = 0, rewindTimer = null;
btnRewind.onclick = () => {
    rewindClicks++;
    clearTimeout(rewindTimer);
    const step = rewindClicks === 1 ? 2 : rewindClicks === 2 ? 5 : 10;
    rewindLbl.textContent = `${step}s`;
    audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - step);
    rewindTimer = setTimeout(() => { rewindClicks = 0; rewindLbl.textContent = "2s"; }, 1200);
};

let forwardClicks = 0, forwardTimer = null;
btnForward.onclick = () => {
    forwardClicks++;
    clearTimeout(forwardTimer);
    const step = forwardClicks === 1 ? 2 : forwardClicks === 2 ? 5 : 10;
    forwardLbl.textContent = `${step}s`;
    audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + step);
    forwardTimer = setTimeout(() => { forwardClicks = 0; forwardLbl.textContent = "2s"; }, 1200);
};

btnRecord.onclick = async () => {
    try {
        if (!audioPlayer.paused) audioPlayer.pause();

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported('audio/webm')) {
            if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
            else mimeType = '';
        }

        mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
        audioChunks = [];
        currentAudioBlob = null;

        btnSave.disabled = true;
        btnUpload.disabled = true;

        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const actualType = mediaRecorder.mimeType || 'audio/webm';
            currentAudioBlob = new Blob(audioChunks, { type: actualType });
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            currentFileName = `تلاوة_${timestamp}.${actualType.includes('mp4') ? 'm4a' : 'webm'}`;

            btnSave.disabled = false;
            btnUpload.disabled = false;

            audioPlayer.src = URL.createObjectURL(currentAudioBlob);
            playerBar.classList.remove('hidden');
            playerPlayIcon.textContent = "▶";

            statusTxt.textContent = "✅ تم حفظ التلاوة، جاهز للفحص.";
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
        };

        mediaRecorder.start(250);
        btnRecord.disabled = true;
        btnStop.disabled = false;
        statusTxt.textContent = "🔴 جاري التسجيل الآن...";
    } catch (err) {
        alert("يرجى إعطاء صلاحية المايكروفون: " + err.message);
        btnRecord.disabled = false;
        btnStop.disabled = true;
    }
};

btnStop.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        btnRecord.disabled = false;
        btnStop.disabled = true;
    }
};

function cleanArabic(text) {
    if (!text) return "";
    return text
        .replace(/[\u06D6-\u06ED\u0610-\u0615ۖۗۘۙۚۛۜ۞۩]/g, '')
        .replace(/[\u0617-\u061A\u064B-\u0652\u0670]/g, '')
        .replace(/[إأآاٱ]/g, 'ا')
        .replace(/[يى]/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي')
        .trim();
}

// دالة ذكية لإزالة نطق أرقام الآيات والكلمات الدخيلة من التسجيل
function filterSpokenAyahNumbers(words) {
    const numberWords = new Set([
        'ايه', 'رقم', 'مائه', 'ميه', 'مائتان', 'ميتين', 'ثلاثمائه', 'اربعمائه', 'خمسمائه',
        'واحد', 'اثنان', 'اثنين', 'ثلاثه', 'ثلاث', 'اربعه', 'اربع', 'خمسه', 'خمس', 'سته', 'ست',
        'سبعه', 'سبع', 'ثمانيه', 'ثماني', 'ثمان', 'تسعه', 'تسع', 'عشره', 'عشر', 'عشرين', 'عشرون',
        'ثلاثين', 'ثلاثون', 'اربعين', 'اربعون', 'خمسين', 'خمسون', 'ستين', 'ستون', 'سبعين', 'سبعون',
        'ثمانين', 'ثمانون', 'تسعين', 'تسعون'
    ]);

    return words.filter(w => {
        const cleaned = cleanArabic(w);
        // استبعاد الأرقام الحسابية الصريحة
        if (/^\d+$/.test(w) \vert{}\vert{} /^[\u0660-\u0669]+$/.test(w)) return false;
        // استبعاد الكلمات التي تطابق أسماء الأعداد
        if (numberWords.has(cleaned)) return false;
        return true;
    });
}

function toArabicNumber(n) {
    const farsiDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    return n.toString().replace(/\d/g, x => farsiDigits[x]);
}

function getDiffOpcodes(a, b) {
    const N = a.length, M = b.length;
    const dp = Array.from({length: N + 1}, () => new Uint16Array(M + 1));
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
            if (a[i] === b[j]) dp[i+1][j+1] = dp[i][j] + 1;
            else dp[i+1][j+1] = Math.max(dp[i+1][j], dp[i][j+1]);
        }
    }
    const ops = [];
    let i = N, j = M;
    while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
            ops.push({tag: 'equal', i1: i-1, i2: i, j1: j-1, j2: j});
            i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
            ops.push({tag: 'insert', i1: i, i2: i, j1: j-1, j2: j});
            j--;
        } else {
            ops.push({tag: 'delete', i1: i-1, i2: i, j1: j, j2: j});
            i--;
        }
    }
    ops.reverse();

    const merged = [];
    for (const op of ops) {
        const last = merged[merged.length - 1];
        if (last && last.tag === op.tag && last.i2 === op.i1 && last.j2 === op.j1) {
            last.i2 = op.i2;
            last.j2 = op.j2;
        } else {
            merged.push({...op});
        }
    }

    const finalOps = [];
    for (let k = 0; k < merged.length; k++) {
        const curr = merged[k];
        const next = merged[k+1];
        if (next && ((curr.tag === 'delete' && next.tag === 'insert') || (curr.tag === 'insert' && next.tag === 'delete'))) {
            finalOps.push({
                tag: 'replace',
                i1: Math.min(curr.i1, next.i1),
                i2: Math.max(curr.i2, next.i2),
                j1: Math.min(curr.j1, next.j1),
                j2: Math.max(curr.j2, next.j2)
            });
            k++;
        } else {
            finalOps.push(curr);
        }
    }
    return finalOps;
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

// دالة الفحص عبر الموديل مع Fallback التلقائي
async function callGeminiWithAutoFallback(apiKey, requestBody) {
    if (!dynamicAudioModels || dynamicAudioModels.length === 0) {
        await fetchValidAudioModels(apiKey);
    }

    const selectedModel = modelSelect.value;
    const modelsToTry = [selectedModel, ...dynamicAudioModels.filter(m => m !== selectedModel)];

    let lastErrorMessage = "";

    for (const modelName of modelsToTry) {
        if (!modelName) continue;
        try {
            statusTxt.textContent = `🤖 جاري الفحص عبر (${modelName})...`;
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.error) {
                const code = data.error.code;
                const msg = data.error.message || "";
                lastErrorMessage = msg;

                if (code === 429) {
                    throw new Error("نفدت كوتة هذا المفتاح حالياً (Rate Limit). يرجى الانتظار دقيقة أو التبديل لمفتاح آخر.");
                }

                console.warn(`الموديل ${modelName} غير متاح أو مضغوط (${code}). التحويل للبديل...`);
                continue;
            }

            if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
                console.warn(`الموديل ${modelName} لم يُرجع نصوصاً صالحة.`);
                continue;
            }

            return data.candidates[0].content.parts[0].text.trim();

        } catch (err) {
            if (err.message.includes("Rate Limit")) throw err;
            console.warn(`خطأ مع ${modelName}:`, err);
        }
    }

    throw new Error(`تعذر التقييم عبر الموديلات المتاحة. تنبيه: ${lastErrorMessage || "يرجى المحاولة مجدداً"}`);
}

            const sName = SURAHS.find(s => s.id === targetSurah).name;
            currentFileName = `تسميع_${sName}_${targetStart}_إلى_${targetEnd}.webm`;
            detectedBanner.classList.add('hidden');
        }

        statusTxt.textContent = "⏳ جاري جلب نص المصحف والمطابقة...";

        // جلب كلمات الآيات وترتيبها بدقة وفق الـ position لضمان ظهور أول كلمة دائماً
        const refWords = [];
        for (let a = targetStart; a <= targetEnd; a++) {
            const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${targetSurah}:${a}?words=true&word_fields=text_imlaei,text_uthmani,position`);
            const json = await res.json();
            
            const wordsList = (json.verse.words || []).sort((w1, w2) => w1.position - w2.position);

            for (const w of wordsList) {
                if (w.text_uthmani && (w.char_type_name === "word" || w.text_imlaei)) {
                    refWords.push({
                        verse_key: `${targetSurah}:${a}`,
                        text_uthmani: w.text_uthmani,
                        text_imlaei: w.text_imlaei || w.text_uthmani
                    });
                }
            }
        }

        const flatReferenceWords = [];
        for (let idx = 0; idx < refWords.length; idx++) {
            const item = refWords[idx];
            const rawImlaei = cleanArabic(item.text_imlaei || item.text_uthmani || '');
            if (!rawImlaei) continue;

            const isLastInVerse = (idx === refWords.length - 1) || (refWords[idx + 1].verse_key !== item.verse_key);
            const ayahNum = item.verse_key.split(':')[1];
            const ayahMarker = isLastInVerse ? ` <span class="text-amber-600 font-sans text-xl inline-block my-1 align-middle">﴿${toArabicNumber(ayahNum)}﴾</span>` : "";

            flatReferenceWords.push({
                verse_key: item.verse_key,
                text_uthmani: item.text_uthmani,
                text_imlaei_single: item.text_imlaei,
                ayah_marker: ayahMarker
            });
        }

        if (intent === 'display_only') {
            let displayHtml = "";
            for (const item of flatReferenceWords) {
                if (item.text_uthmani) displayHtml += `<span class="inline-block my-1">${item.text_uthmani}</span> `;
                if (item.ayah_marker) displayHtml += item.ayah_marker + " ";
            }
            quranContent.innerHTML = displayHtml;
            unifiedResultArea.classList.remove('hidden');
            statsBar.classList.add('hidden');
            statusTxt.textContent = "✅ تم استعراض الآيات المطلوبة.";
            return;
        }

        // تفريغ الكلمات مع فلترة أي نطق لأرقام الآيات
        const rawRecitedWords = transcription.split(/\s+/).filter(Boolean);
        const recitedWords = filterSpokenAyahNumbers(rawRecitedWords);

        const cleanRef = flatReferenceWords.map(w => cleanArabic(w.text_imlaei_single));
        const cleanRec = recitedWords.map(w => cleanArabic(w));
        const opcodes = getDiffOpcodes(cleanRef, cleanRec);

        let correctCount = 0, mistakesCount = 0;
        let finalUnifiedHtml = "";

        for (const op of opcodes) {
            if (op.tag === 'equal') {
                for (let idx = op.i1; idx < op.i2; idx++) {
                    correctCount++;
                    const item = flatReferenceWords[idx];
                    if (item.text_uthmani) finalUnifiedHtml += `<span class="text-slate-800 inline-block my-1">${item.text_uthmani}</span> `;
                    if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                }
            } else if (op.tag === 'replace') {
                const refLen = op.i2 - op.i1, recLen = op.j2 - op.j1;
                const maxLen = Math.max(refLen, recLen);
                mistakesCount += recLen;

                for (let k = 0; k < maxLen; k++) {
                    const item = k < refLen ? flatReferenceWords[op.i1 + k] : null;
                    const recW = k < recLen ? recitedWords[op.j1 + k] : null;

                    if (item && recW) {
                        finalUnifiedHtml += `<span class="bg-red-100 text-red-700 border-b-2 border-red-500 px-1.5 py-0.5 rounded inline-block my-1 cursor-help" title="نطقت: ${recW}">${item.text_uthmani}</span> `;
                        if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                    } else if (item && !recW) {
                        finalUnifiedHtml += `<span class="bg-red-50 text-red-600 border-b-2 border-dashed border-red-400 px-1.5 py-0.5 rounded inline-block my-1 cursor-help" title="منسية">${item.text_uthmani}</span> `;
                        if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                    } else if (!item && recW) {
                        finalUnifiedHtml += `<span class="bg-amber-100 text-amber-800 border border-amber-400 text-base font-sans px-2 py-0.5 rounded inline-block my-1 cursor-help" title="زيادة">+ (${recW})</span> `;
                    }
                }
            } else if (op.tag === 'delete') {
                mistakesCount += (op.i2 - op.i1);
                for (let idx = op.i1; idx < op.i2; idx++) {
                    const item = flatReferenceWords[idx];
                    if (item.text_uthmani) finalUnifiedHtml += `<span class="bg-red-50 text-red-600 border-b-2 border-dashed border-red-400 px-1.5 py-0.5 rounded inline-block my-1 cursor-help" title="منسية">${item.text_uthmani}</span> `;
                    if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                }
            } else if (op.tag === 'insert') {
                mistakesCount += (op.j2 - op.j1);
                for (let idx = op.j1; idx < op.j2; idx++) {
                    finalUnifiedHtml += `<span class="bg-amber-100 text-amber-800 border border-amber-400 text-base font-sans px-2 py-0.5 rounded inline-block my-1 cursor-help" title="زيادة">+ (${recitedWords[idx]})</span> `;
                }
            }
        }

        correctBadge.textContent = `✓ صحيح: ${correctCount}`;
        mistakeBadge.textContent = `✗ تنبيهات: ${mistakesCount}`;
        statsBar.classList.remove('hidden');
        statsBar.classList.add('flex');

        quranContent.innerHTML = finalUnifiedHtml;
        unifiedResultArea.classList.remove('hidden');
        statusTxt.textContent = "✅ اكتمل التقييم بنجاح!";
    } catch (err) {
        console.error(err);
        statusTxt.textContent = `❌ حدث خطأ: ${err.message}`;
    } finally {
        btnUpload.disabled = false;
    }
};

// تشغيل الفحص الأولي عند فتح الصفحة
refreshKeyUI(true);
</script>
</body>
</html>
