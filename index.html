<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>المسمّع القرآني التفاعلي</title>
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --warning-bg: #fef3c7;
            --warning-border: #b45309;
            --success-bg: #dcfce7;
            --text-main: #1e293b;
            --border-col: #cbd5e1;
            --bg-card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Amiri", Tahoma, sans-serif;
            background-color: #f8fafc;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px -2px rgba(0,0,0,0.05);
        }

        h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: var(--primary-dark);
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="password"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-col);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fafafa;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .selectors-grid {
                grid-template-columns: 1fr;
            }
        }

        .audio-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            align-items: center;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-record { background-color: var(--primary); color: white; }
        .btn-stop { background-color: var(--danger); color: white; }
        .btn-play { background-color: #2563eb; color: white; }
        .btn-upload { background-color: #d97706; color: white; }

        .status-box {
            padding: 10px 14px;
            border-radius: 6px;
            background: #f1f5f9;
            border: 1px solid var(--border-col);
            font-size: 0.9rem;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* لوحة عرض المصحف الموحدة */
        .quran-unified-display {
            direction: rtl;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            font-size: 1.55rem;
            line-height: 2.5;
            padding: 24px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-col);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            text-align: justify;
            word-spacing: 3px;
            margin-top: 15px;
        }

        .word-correct {
            color: #1e293b;
            margin: 0 2px;
        }

        .word-mistake {
            background: var(--danger-bg);
            color: #991b1b;
            border-bottom: 2px solid var(--danger);
            border-radius: 4px;
            padding: 1px 6px;
            margin: 0 2px;
            cursor: help;
        }

        .word-missing {
            background: var(--danger-bg);
            color: var(--danger);
            border-bottom: 2px dashed var(--danger);
            border-radius: 4px;
            padding: 1px 6px;
            margin: 0 2px;
            cursor: help;
        }

        .word-extra {
            background: var(--warning-bg);
            color: #92400e;
            border: 1px solid var(--warning-border);
            border-radius: 4px;
            padding: 1px 6px;
            margin: 0 3px;
            font-size: 0.9rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: inline-block;
            line-height: 1.5;
            cursor: help;
        }

        .ayah-marker {
            color: #ca8a04;
            font-weight: normal;
            margin: 0 6px;
            font-size: 1.1rem;
        }

        .badge-stat {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-success { background: var(--success-bg); color: var(--primary-dark); }
        .badge-danger { background: var(--danger-bg); color: var(--danger); }

        .legend {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #64748b;
            display: flex;
            gap: 15px;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
</head>

// خوارزميات المعالجة والتنظيف المطابقة تماماً للبايثون
function cleanArabic(text) {
    if (!text) return "";
    return text
        .replace(/[\u06D6-\u06ED\u0610-\u0615ۖۗۘۙۚۛۜ۞۩]/g, '')
        .replace(/[\u0617-\u061A\u064B-\u0652\u0670]/g, '')
        .replace(/[إأآاٱ]/g, 'ا')
        .replace(/[يى]/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي')
        .trim();
}

function toArabicNumber(n) {
    const farsiDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    return n.toString().replace(/\d/g, x => farsiDigits[x]);
}

function getDiffOpcodes(a, b) {
    const N = a.length, M = b.length;
    const dp = Array.from({length: N + 1}, () => new Uint16Array(M + 1));
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
            if (a[i] === b[j]) dp[i+1][j+1] = dp[i][j] + 1;
            else dp[i+1][j+1] = Math.max(dp[i+1][j], dp[i][j+1]);
        }
    }
    const ops = [];
    let i = N, j = M;
    while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
            ops.push({tag: 'equal', i1: i-1, i2: i, j1: j-1, j2: j});
            i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
            ops.push({tag: 'insert', i1: i, i2: i, j1: j-1, j2: j});
            j--;
        } else {
            ops.push({tag: 'delete', i1: i-1, i2: i, j1: j, j2: j});
            i--;
        }
    }
    ops.reverse();

    const merged = [];
    for (const op of ops) {
        const last = merged[merged.length - 1];
        if (last && last.tag === op.tag && last.i2 === op.i1 && last.j2 === op.j1) {
            last.i2 = op.i2;
            last.j2 = op.j2;
        } else {
            merged.push({...op});
        }
    }

    const finalOps = [];
    for (let k = 0; k < merged.length; k++) {
        const curr = merged[k];
        const next = merged[k+1];
        if (next && ((curr.tag === 'delete' && next.tag === 'insert') || (curr.tag === 'insert' && next.tag === 'delete'))) {
            finalOps.push({
                tag: 'replace',
                i1: Math.min(curr.i1, next.i1),
                i2: Math.max(curr.i2, next.i2),
                j1: Math.min(curr.j1, next.j1),
                j2: Math.max(curr.j2, next.j2)
            });
            k++;
        } else {
            finalOps.push(curr);
        }
    }
    return finalOps;
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

        const requestBody = {

            generationConfig: {

            }

        const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(requestBody)
        });

        const geminiData = await geminiRes.json();

        // 1. فحص وجود خطأ صريح من السيرفر
        if (geminiData.error) {
            throw new Error(geminiData.error.message || JSON.stringify(geminiData.error));
        }

        // 2. فحص هل تم حجب الرد بسبب الأمان أو الفلترة
        if (geminiData.promptFeedback && geminiData.promptFeedback.blockReason) {
            throw new Error(`تم إيقاف المعالجة من السيرفر بسبب: ${geminiData.promptFeedback.blockReason}`);
        }

        // 3. فحص وجود المرشحات (candidates) بأمان تام لتفادي الخطأ
        if (!geminiData.candidates || geminiData.candidates.length === 0) {
            console.error("Gemini Full Response:", geminiData);
            throw new Error("لم يتم استخراج أي نص من التسجيل، تأكد من وضوح الصوت ومطابقة الآيات المحددة.");
        }

        const candidate = geminiData.candidates[0];
        if (candidate.finishReason && candidate.finishReason !== "STOP") {
            console.warn("Finish Reason:", candidate.finishReason);
        }

        // استخراج النص بأمان مع التعامل مع احتمالية عدم وجود parts
        const parts = candidate.content?.parts;
        if (!parts || parts.length === 0 || !parts[0].text) {
            throw new Error("وصل الرد فارغاً من النموذج، يرجى إعادة تسجيل الصوت بوضوح.");
        }

        const recitedRawText = parts[0].text.trim();
        console.log("النص المفرغ بنجاح:", recitedRawText);
        // تجهيز مصفوفة كلمات المصحف مع فواصل الآيات
        const flatReferenceWords = [];
        for (let idx = 0; idx < refWords.length; idx++) {
            const item = refWords[idx];
            const rawImlaei = cleanArabic(item.text_imlaei || '');
            if (!rawImlaei) continue;

            const subWords = item.text_imlaei.split(/\s+/).filter(Boolean);
            for (let sIdx = 0; sIdx < subWords.length; sIdx++) {
                const sub = subWords[sIdx];
                if (cleanArabic(sub)) {
                    const displayUthmani = (sIdx === 0) ? item.text_uthmani : "";
                    let isLastInVerse = false;
                    if (sIdx === subWords.length - 1) {
                        if (idx === refWords.length - 1 || refWords[idx+1].verse_key !== item.verse_key) {
                            isLastInVerse = true;
                        }
                    }
                    const ayahNum = item.verse_key.split(':')[1];
                    const ayahMarker = isLastInVerse ? ` <span class="ayah-marker">﴿${toArabicNumber(ayahNum)}﴾</span>` : "";

                    flatReferenceWords.push({
                        verse_key: item.verse_key,
                        text_uthmani: displayUthmani,
                        text_imlaei_single: sub,
                        ayah_marker: ayahMarker
                    });
                }
            }
        }

        const recitedWords = recitedRawText.split(/\s+/).filter(Boolean);
        const cleanRef = flatReferenceWords.map(w => cleanArabic(w.text_imlaei_single));
        const cleanRec = recitedWords.map(w => cleanArabic(w));

        const opcodes = getDiffOpcodes(cleanRef, cleanRec);

        let correctCount = 0;
        let mistakesCount = 0;
        let finalUnifiedHtml = "";

        // بناء العرض الموحد: النص الأصلي مع العلامات والتلوين
        for (const op of opcodes) {
            if (op.tag === 'equal') {
                for (let idx = op.i1; idx < op.i2; idx++) {
                    correctCount++;
                    const refW = flatReferenceWords[idx].text_uthmani;
                    if (refW) {
                        finalUnifiedHtml += `<span class="word-correct">${refW}</span> `;
                    }
                    if (flatReferenceWords[idx].ayah_marker) {
                        finalUnifiedHtml += flatReferenceWords[idx].ayah_marker + " ";
                    }
                }
            } else if (op.tag === 'replace') {
                const refLen = op.i2 - op.i1;
                const recLen = op.j2 - op.j1;
                mistakesCount += recLen;

                const recitedPart = recitedWords.slice(op.j1, op.j2).join(' ');
                const quranPart = flatReferenceWords.slice(op.i1, op.i2).map(w => w.text_uthmani).filter(Boolean).join(' ');

                finalUnifiedHtml += `<span class="word-mistake" title="نطقت: (${recitedPart})">${quranPart || '[خطأ لفظي]'}</span> `;

                for (let k = op.i1; k < op.i2; k++) {
                    if (flatReferenceWords[k].ayah_marker) {
                        finalUnifiedHtml += flatReferenceWords[k].ayah_marker + " ";
                    }
                }
            } else if (op.tag === 'delete') {
                // كلمات سقطت أو نسيها القارئ -> أحمر
                mistakesCount += (op.i2 - op.i1);
                const missingQuran = flatReferenceWords.slice(op.i1, op.i2).map(w => w.text_uthmani).filter(Boolean).join(' ');

                finalUnifiedHtml += `<span class="word-missing" title="لم تُقرأ / منسية">${missingQuran}</span> `;

                for (const op of opcodes) {
            if (op.tag === 'equal') {
                for (let idx = op.i1; idx < op.i2; idx++) {
                    correctCount++;
                    const item = flatReferenceWords[idx];
                    if (item.text_uthmani) {
                        finalUnifiedHtml += `<span class="word-correct">${item.text_uthmani}</span> `;
                    }
                    if (item.ayah_marker) {
                        finalUnifiedHtml += item.ayah_marker + " ";
                    }
                }
            } else if (op.tag === 'replace') {
                const refLen = op.i2 - op.i1;
                const recLen = op.j2 - op.j1;
                const maxLen = Math.max(refLen, recLen);
                mistakesCount += recLen;

                for (let k = 0; k < maxLen; k++) {
                    const item = k < refLen ? flatReferenceWords[op.i1 + k] : null;
                    const recW = k < recLen ? recitedWords[op.j1 + k] : null;

                    if (item && recW) {
                        finalUnifiedHtml += `<span class="word-mistake" title="نطقت: (${recW})">${item.text_uthmani}</span> `;
                        if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                    } else if (item && !recW) {
                        finalUnifiedHtml += `<span class="word-missing" title="لم تُقرأ / منسية">${item.text_uthmani}</span> `;
                        if (item.ayah_marker) finalUnifiedHtml += item.ayah_marker + " ";
                    } else if (!item && recW) {
                        finalUnifiedHtml += `<span class="word-extra" title="زيادة غير موجودة">+ (${recW})</span> `;
                    }
                }
            } else if (op.tag === 'delete') {
                // معالجة كل كلمة منسية مع رقم آيتها الخاص بها مباشرة
                mistakesCount += (op.i2 - op.i1);
                for (let idx = op.i1; idx < op.i2; idx++) {
                    const item = flatReferenceWords[idx];
                    if (item.text_uthmani) {
                        finalUnifiedHtml += `<span class="word-missing" title="لم تُقرأ / منسية">${item.text_uthmani}</span> `;
                    }
                    if (item.ayah_marker) {
                        finalUnifiedHtml += item.ayah_marker + " ";
                    }
                }
            } else if (op.tag === 'insert') {
                mistakesCount += (op.j2 - op.j1);
                for (let idx = op.j1; idx < op.j2; idx++) {
                    finalUnifiedHtml += `<span class="word-extra" title="زيادة غير موجودة">+ (${recitedWords[idx]})</span> `;
                }
            }
        }
            } else if (op.tag === 'insert') {
                // زيادات نطق بها القارئ غير موجودة بالمصحف -> أصفر
                mistakesCount += (op.j2 - op.j1);
                const extraWords = recitedWords.slice(op.j1, op.j2).join(' ');
                finalUnifiedHtml += `<span class="word-extra" title="زيادة غير موجودة في الآية">+ (${extraWords})</span> `;
            }
        }

        correctBadge.textContent = `✓ صحيح: ${correctCount}`;
        mistakeBadge.textContent = `✗ تنبيهات: ${mistakesCount}`;
        statsBar.style.display = "flex";

        quranContent.innerHTML = finalUnifiedHtml;
        unifiedResultArea.style.display = "block";

        statusTxt.textContent = "✅ اكتمل التقييم بنجاح!";
    } catch (err) {
        console.error(err);
        statusTxt.textContent = `❌ حدث خطأ: ${err.message}`;
    } finally {
        btnUpload.disabled = false;
    }
};
